{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GradeDesk - Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="{% static 'css/login.css' %}" />
  </head>
  <body>
    <div class="auth-root">
      <div class="auth-shell">
        <div class="brand-col">
          <div class="brand-logo">GD</div>
          <h1 class="brand-title">GradeDesk</h1>
          <p class="brand-sub">Reset your account password securely.</p>
        </div>

        <div class="form-col">
          <div class="auth-card">
            <div class="auth-card-header">
              <div class="auth-card-title">Set New Password</div>
              <div class="auth-card-sub">Enter your new password below.</div>
            </div>

            <div class="auth-form">
              <div class="form-group">
                <label for="reset-password">New password</label>
                <input type="password" id="reset-password" placeholder="Min. 8 characters" minlength="8" maxlength="128" autocomplete="new-password" />
                <span class="field-error" id="err-reset-password"></span>
              </div>
              <div class="form-group">
                <label for="reset-confirm-password">Confirm new password</label>
                <input type="password" id="reset-confirm-password" placeholder="Repeat new password" minlength="8" maxlength="128" autocomplete="new-password" />
                <span class="field-error" id="err-reset-confirm-password"></span>
              </div>

              <button class="btn btn-primary btn-full" id="reset-submit">
                <span class="btn-label">Reset password</span>
              </button>
              <a class="btn btn-secondary btn-full" href="/login.html">Back to login</a>
            </div>

            <div class="form-error-banner" id="reset-banner" hidden>
              <span id="reset-banner-msg">Something went wrong.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="{% static 'js/reset-password.js' %}" defer></script>
  </body>
</html>
