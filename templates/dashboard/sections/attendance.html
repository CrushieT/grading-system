<section class="page" id="page-attendance">
  <div class="page-header">
    <div>
      <div class="page-title">Attendance</div>
      <div class="page-sub">Daily tracking per schedule.</div>
    </div>
    <button type="button" class="btn btn-primary" id="attendance-save-btn" data-action="at-save-attendance" disabled>Save</button>
  </div>

  <div class="setup-feedback" id="attendance-feedback" hidden></div>

  <div class="filter-bar">
    <select class="filter-select" id="attendance-schedule-filter">
      <option value="">Loading schedules...</option>
    </select>
    <input type="date" id="attendance-date-filter" class="filter-select">
    <button type="button" class="btn btn-secondary btn-xs" data-action="at-prev-day" id="attendance-prev-day-btn">Previous Day</button>
    <button type="button" class="btn btn-secondary btn-xs" data-action="at-next-day" id="attendance-next-day-btn">Next Day</button>
    <div class="att-legend">
      <span class="att-btn p">P</span>
      <span class="att-btn a">A</span>
      <span class="att-btn l">L</span>
      <span class="att-btn e">E</span>
    </div>
  </div>

  <article class="card desktop-table">
    <div class="table-wrap scrollable-table">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Previous</th>
            <th id="attendance-date-header">Selected Date</th>
            <th>Rate</th>
          </tr>
        </thead>
        <tbody id="attendance-table-body">
          <tr>
            <td colspan="4" class="setup-sub">Loading attendance...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </article>

  <div class="mobile-card-list" id="attendance-mobile-list">
    <article class="m-card">
      <div class="setup-sub">Loading attendance...</div>
    </article>
  </div>
</section>
