<section class="page" id="page-students">
  <div class="page-header">
    <div>
      <div class="page-title">Students</div>
      <div class="page-sub">Manage student records.</div>
    </div>
    <div class="btn-group-wrap">
      <button type="button" class="btn btn-primary" data-action="st-open-student-create">+ Add</button>
    </div>
  </div>

  <div class="setup-feedback" id="students-feedback" hidden></div>

  <div class="filter-bar">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9c9a94" stroke-width="1.5">
        <circle cx="7" cy="7" r="4"></circle>
        <line x1="10.5" y1="10.5" x2="14" y2="14"></line>
      </svg>
      <input type="text" id="student-search-input" placeholder="Search by name or ID...">
    </div>
    <select class="filter-select" id="student-section-filter">
      <option value="">All Sections</option>
    </select>
    <select class="filter-select" id="student-year-level-filter">
      <option value="">All Year Levels</option>
      <option value="7">Year 7</option>
      <option value="8">Year 8</option>
      <option value="9">Year 9</option>
      <option value="10">Year 10</option>
      <option value="11">Year 11</option>
      <option value="12">Year 12</option>
    </select>
  </div>

  <article class="card desktop-table">
    <div class="table-wrap scrollable-table">
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Student ID</th>
            <th>Section</th>
            <th>Year Level</th>
            <th>Avg Grade</th>
            <th>Attendance</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="students-table-body">
          <tr>
            <td colspan="7" class="setup-sub">Loading students...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </article>

  <div class="mobile-card-list" id="students-mobile-list">
    <article class="m-card">
      <div class="setup-sub">Loading students...</div>
    </article>
  </div>

  <div class="modal-overlay" id="modal-student-delete" hidden>
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Delete Student</div>
        <button type="button" class="close-btn" data-action="st-close-delete-modal">x</button>
      </div>
      <div class="modal-body">
        <p class="modal-copy" id="student-delete-message">Are you sure you want to delete this student?</p>
        <div class="setup-modal-error" id="student-delete-error" hidden></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-action="st-close-delete-modal">Cancel</button>
        <button type="button" class="btn btn-danger" data-action="st-confirm-delete">Delete</button>
      </div>
    </div>
  </div>
</section>
